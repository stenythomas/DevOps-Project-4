services:
  db:
    image: mysql:8.4
    container_name: project4-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  web:
    image: project4-app:v1
    container_name: project4-web
    restart: unless-stopped

    expose:
      - "8000"

    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Secret key required}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"

    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media

    command: >
      sh -c "python manage.py collectstatic --noinput &&
      exec gunicorn --bind 0.0.0.0:8000
      --workers 2 --timeout 120
      --access-logfile -
      --error-logfile -
      project4.wsgi:application"

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: project4-nginx
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro

    depends_on:
      - web

volumes:
  mysql_data:
  static_data:
  media_data:
